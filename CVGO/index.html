(() => {
    const STORAGE_KEY = 'custom-crosshair-settings';
    const WRAPPER_ID = 'custom-crosshair-wrapper';
    const STYLE_ID = 'custom-crosshair-styles';
    const MAX_SIZE = 100;
    const TAB_SIZE = 24;
    const EDGE_GAP = 15;

    const previous = document.getElementById(WRAPPER_ID);
    if (previous) {
        previous.dispatchEvent(new Event('custom-crosshair-destroy'));
        previous.remove();
    }

    const oldStyle = document.getElementById(STYLE_ID);
    if (oldStyle) oldStyle.remove();

    let savedSettings = {};

    try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

        if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
            savedSettings = parsed;
        }
    } catch {
        savedSettings = {};
    }

    function finiteNumber(value, fallback) {
        const number = Number(value);
        return Number.isFinite(number) ? number : fallback;
    }

    const savedSize = Math.min(
        MAX_SIZE,
        Math.max(0, finiteNumber(savedSettings.size, 0))
    );

    let menuHidden = true;

    let tabSide = savedSettings.tabSide === 'left' ? 'left' : 'right';

    let savedTabTop = finiteNumber(
        savedSettings.tabTop,
        window.innerHeight / 2 - TAB_SIZE / 2
    );

    const wrapper = document.createElement('div');
    wrapper.id = WRAPPER_ID;

    const crosshair = document.createElement('div');

    Object.assign(crosshair.style, {
        position: 'fixed',
        top: '50%',
        left: '50%',
        width: '0',
        height: '0',
        transform: 'translate(-50%, -50%)',
        pointerEvents: 'none',
        zIndex: '2147483647'
    });
         crosshair.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display:block;width:100%;height:100%;overflow:visible;color:var(--vortexMode);filter:none !important;text-shadow:none !important;pointer-events:none;"><g id="ch-svg-group" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8" vector-effect="non-scaling-stroke"/><line x1="12" y1="2" x2="12" y2="6" vector-effect="non-scaling-stroke"/><line x1="12" y1="18" x2="12" y2="22" vector-effect="non-scaling-stroke"/><line x1="2" y1="12" x2="6" y2="12" vector-effect="non-scaling-stroke"/><line x1="18" y1="12" x2="22" y2="12" vector-effect="non-scaling-stroke"/><circle cx="12" cy="12" r="0.1" fill="currentColor" vector-effect="non-scaling-stroke"/></g></svg>`;



    const controls = document.createElement('div');
    controls.id = 'ch-controls';

    Object.assign(controls.style, {
        position: 'fixed',
        display: 'flex',
        alignItems: 'center',
        gap: '8px',
        boxSizing: 'border-box',
        padding: '8px 10px',
        backgroundColor: 'rgba(20, 20, 20, 0.94)',
        color: 'var(--vortexMode)',
        border: '1px solid var(--vortexMode)',
        borderRadius: '6px',
        fontFamily: 'sans-serif',
        fontSize: '12px',
        zIndex: '2147483647',
        boxShadow: '0 2px 10px rgba(0, 0, 0, 0.5)',
        userSelect: 'none'
    });

    controls.innerHTML = `
        <span id="ch-size-val">${savedSize}px</span>

        <input
            id="ch-size-slider"
            type="range"
            min="0"
            max="${MAX_SIZE}"
            step="1"
            value="${savedSize}"
            title="Crosshair Size"
            aria-label="Crosshair Size"
        >

        <button
            id="ch-close-btn"
            type="button"
            title="Hide Settings"
            aria-label="Hide Settings"
        >✕</button>
    `;

    const pullTab = document.createElement('button');

    pullTab.id = 'ch-pull-tab';
    pullTab.type = 'button';
    pullTab.title = 'Crosshair Settings';
    pullTab.setAttribute('aria-label', 'Crosshair Settings');

    Object.assign(pullTab.style, {
        position: 'fixed',
        top: '0',
        width: `${TAB_SIZE}px`,
        height: `${TAB_SIZE}px`,
        minWidth: `${TAB_SIZE}px`,
        minHeight: `${TAB_SIZE}px`,
        maxWidth: `${TAB_SIZE}px`,
        maxHeight: `${TAB_SIZE}px`,
        padding: '0',
        border: 'none',
        backgroundColor: '#141414',
        color: 'var(--vortexMode)',
        fontFamily: 'sans-serif',
        fontSize: '17px',
        lineHeight: `${TAB_SIZE}px`,
        textAlign: 'center',
        cursor: 'pointer',
        zIndex: '2147483647',
        boxShadow: '0 2px 10px rgba(0, 0, 0, 0.5)',
        userSelect: 'none',
        touchAction: 'none',
        overflow: 'hidden'
    });

    const style = document.createElement('style');

    style.id = STYLE_ID;

    style.textContent = `
        #${WRAPPER_ID} #ch-size-slider {
            display: block;
            width: 90px;
            height: 16px;
            margin: 0;
            padding: 0;
            accent-color: var(--vortexMode);
            cursor: pointer;
            background: transparent;
            appearance: none;
            -webkit-appearance: none;
            touch-action: none;
        }

        #${WRAPPER_ID} #ch-size-slider.is-dragging {
            cursor: grabbing !important;
        }

        #${WRAPPER_ID} #ch-size-slider::-webkit-slider-runnable-track {
            height: 4px;
            background: var(--vortexMode);
            border-radius: 4px;
            cursor: pointer;
        }

        #${WRAPPER_ID} #ch-size-slider::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 11px;
            height: 11px;
            margin-top: -3.5px;
            box-sizing: border-box;
            border-radius: 50%;
            background: var(--vortexMode);
            border: 1.5px solid #101010;
            cursor: pointer;
        }

        #${WRAPPER_ID} #ch-size-slider.is-dragging::-webkit-slider-thumb {
            cursor: grabbing;
        }

        #${WRAPPER_ID} #ch-size-slider::-moz-range-track {
            height: 4px;
            background: var(--vortexMode);
            border-radius: 4px;
            cursor: pointer;
        }

        #${WRAPPER_ID} #ch-size-slider::-moz-range-progress {
            height: 4px;
            background: var(--vortexMode);
            border-radius: 4px;
            cursor: pointer;
        }

        #${WRAPPER_ID} #ch-size-slider::-moz-range-thumb {
            width: 11px;
            height: 11px;
            box-sizing: border-box;
            border-radius: 50%;
            background: var(--vortexMode);
            border: 1.5px solid #101010;
            cursor: pointer;
        }

        #${WRAPPER_ID} #ch-size-slider.is-dragging::-moz-range-thumb {
            cursor: grabbing;
        }

        #${WRAPPER_ID} #ch-close-btn {
            flex: 0 0 auto;
            background: #333;
            color: var(--vortexMode);
            border: none;
            border-radius: 3px;
            cursor: pointer;
            padding: 2px 6px;
            margin-left: 2px;
            font-size: 12px;
            transition: all 0.9s ease;
        }

        #${WRAPPER_ID} #ch-close-btn:hover {
            background: #222222;
            transition: all 0.7s ease;
            opacity: 0.65;
        }

        #${WRAPPER_ID} #ch-size-val {
            flex: 0 0 58px;
            width: 58px;
            white-space: nowrap;
            text-align: left;
        }

        #${WRAPPER_ID}[data-tab-side="left"] #ch-size-val {
            text-align: right;
        }

        #${WRAPPER_ID} #ch-pull-tab {
            cursor: pointer !important;
        }

        #${WRAPPER_ID} #ch-pull-tab.is-dragging {
            cursor: grabbing !important;
        }
    `;

    document.head.appendChild(style);

    wrapper.append(crosshair, controls, pullTab);
    document.body.appendChild(wrapper);

    const slider = controls.querySelector('#ch-size-slider');
    const valDisplay = controls.querySelector('#ch-size-val');
    const closeBtn = controls.querySelector('#ch-close-btn');

    let tabDragging = false;
    let tabPointerId = null;
    let tabStartX = 0;
    let tabStartY = 0;
    let tabOffsetX = 0;
    let tabOffsetY = 0;
    let suppressNextTabClick = false;

    let sliderPointerId = null;
    let sliderStartX = 0;
    let sliderStartY = 0;
    let sliderMoved = false;

    function saveSettings() {
        try {
            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify({
                    size: Number(slider.value),
                    menuHidden,
                    tabSide,
                    tabTop: finiteNumber(
                        parseFloat(pullTab.style.top),
                        savedTabTop
                    )
                })
            );
        } catch {
            // Storage can be unavailable; controls remain usable.
        }
    }

    function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
    }

    function clampTabTop(top) {
        const height = pullTab.offsetHeight || TAB_SIZE;

        return clamp(
            top,
            0,
            Math.max(0, window.innerHeight - height)
        );
    }

            function updateCrosshairSize(value, shouldSave = true) {
        const size = clamp(
            Math.round(finiteNumber(value, 0)),
            0,
            MAX_SIZE
        );

        const thickness = size === 0
            ? 0
            : Number(Math.max(1.8, size / 10).toFixed(2));

        crosshair.style.width = `${size}px`;
        crosshair.style.height = `${size}px`;

        const svgGroup = crosshair.querySelector('#ch-svg-group');
        if (svgGroup) {
            svgGroup.setAttribute('stroke-width', String(thickness));
        }

        valDisplay.textContent = `Size: ${size}%`;
        slider.value = String(size);

        crosshair.style.display = size === 0
            ? 'none'
            : 'block';

        if (shouldSave) saveSettings();
    }



    function updateTabSide(side) {
        tabSide = side === 'left'
            ? 'left'
            : 'right';

        wrapper.dataset.tabSide = tabSide;

        pullTab.style.left = tabSide === 'left'
            ? '0'
            : 'auto';

        pullTab.style.right = tabSide === 'right'
            ? '0'
            : 'auto';

        pullTab.style.borderRadius = tabSide === 'left'
            ? '0 7px 7px 0'
            : '7px 0 0 7px';

        pullTab.textContent = '⌖';

        if (tabSide === 'left') {
            controls.append(closeBtn, slider, valDisplay);
        } else {
            controls.append(valDisplay, slider, closeBtn);
        }

        positionControls();
    }

    function positionControls() {
        if (menuHidden) return;

        controls.style.top = `${EDGE_GAP}px`;
        controls.style.bottom = 'auto';

        if (tabSide === 'left') {
            controls.style.left = `${TAB_SIZE + EDGE_GAP}px`;
            controls.style.right = 'auto';
        } else {
            controls.style.left = 'auto';
            controls.style.right = `${TAB_SIZE + EDGE_GAP}px`;
        }
    }

    function showMenu() {
        menuHidden = false;

        controls.style.display = 'flex';
        pullTab.style.display = 'none';

        positionControls();
        saveSettings();
    }

    function hideMenu() {
        menuHidden = true;

        controls.style.display = 'none';
        pullTab.style.display = 'block';

        saveSettings();
    }

    function onResize() {
        savedTabTop = clampTabTop(
            finiteNumber(
                parseFloat(pullTab.style.top),
                savedTabTop
            )
        );

        pullTab.style.top = `${savedTabTop}px`;

        positionControls();
        saveSettings();
    }

    function finishSliderDrag(event) {
        if (
            sliderPointerId === null ||
            event.pointerId !== sliderPointerId
        ) {
            return;
        }

        sliderPointerId = null;
        sliderMoved = false;

        slider.classList.remove('is-dragging');
        slider.style.cursor = 'pointer';

        if (slider.hasPointerCapture(event.pointerId)) {
            slider.releasePointerCapture(event.pointerId);
        }
    }

    slider.addEventListener('pointerdown', event => {
        if (event.button !== 0) return;

        sliderPointerId = event.pointerId;
        sliderStartX = event.clientX;
        sliderStartY = event.clientY;
        sliderMoved = false;
    });

    slider.addEventListener('pointermove', event => {
        if (event.pointerId !== sliderPointerId) return;

        const movedX = Math.abs(event.clientX - sliderStartX);
        const movedY = Math.abs(event.clientY - sliderStartY);

        if (
            !sliderMoved &&
            (movedX >= 2 || movedY >= 2)
        ) {
            sliderMoved = true;

            slider.classList.add('is-dragging');
            slider.style.cursor = 'grabbing';
        }
    });

    slider.addEventListener('pointerup', finishSliderDrag);
    slider.addEventListener('pointercancel', finishSliderDrag);

    slider.addEventListener('lostpointercapture', event => {
        if (event.pointerId === sliderPointerId) {
            sliderPointerId = null;
            sliderMoved = false;

            slider.classList.remove('is-dragging');
            slider.style.cursor = 'pointer';
        }
    });

    slider.addEventListener('input', event => {
        updateCrosshairSize(event.currentTarget.value);
    });

    closeBtn.addEventListener('click', event => {
        event.preventDefault();
        event.stopPropagation();

        hideMenu();
    });

    controls.addEventListener('pointerdown', event => {
        event.stopPropagation();
    });

    pullTab.addEventListener('pointerdown', event => {
        if (event.button !== 0) return;

        tabDragging = false;
        tabPointerId = event.pointerId;

        tabStartX = event.clientX;
        tabStartY = event.clientY;

        const rect = pullTab.getBoundingClientRect();

        tabOffsetX = event.clientX - rect.left;
        tabOffsetY = event.clientY - rect.top;

        pullTab.setPointerCapture(event.pointerId);

        event.preventDefault();
    });

    pullTab.addEventListener('pointermove', event => {
        if (event.pointerId !== tabPointerId) return;

        const movedX = Math.abs(event.clientX - tabStartX);
        const movedY = Math.abs(event.clientY - tabStartY);

        if (
            !tabDragging &&
            movedX < 5 &&
            movedY < 5
        ) {
            return;
        }

        tabDragging = true;

        pullTab.classList.add('is-dragging');
        pullTab.style.cursor = 'grabbing';

        const tabWidth = pullTab.offsetWidth || TAB_SIZE;

        const newLeft = clamp(
            event.clientX - tabOffsetX,
            0,
            Math.max(0, window.innerWidth - tabWidth)
        );

        const newTop = clampTabTop(
            event.clientY - tabOffsetY
        );

        const distanceToLeft = newLeft;
        const distanceToRight =
            window.innerWidth - (newLeft + tabWidth);

        pullTab.style.top = `${newTop}px`;
        savedTabTop = newTop;

        updateTabSide(
            distanceToLeft <= distanceToRight
                ? 'left'
                : 'right'
        );
    });

    function finishTabPointer(event) {
        if (event.pointerId !== tabPointerId) return;

        const wasDragged = tabDragging;

        tabDragging = false;
        tabPointerId = null;

        pullTab.classList.remove('is-dragging');
        pullTab.style.cursor = 'pointer';

        if (pullTab.hasPointerCapture(event.pointerId)) {
            pullTab.releasePointerCapture(event.pointerId);
        }

        if (wasDragged) {
            suppressNextTabClick = true;

            setTimeout(() => {
                suppressNextTabClick = false;
            }, 0);

            saveSettings();
        } else {
            showMenu();
        }
    }

    pullTab.addEventListener('pointerup', finishTabPointer);

    pullTab.addEventListener('pointercancel', event => {
        if (pullTab.hasPointerCapture(event.pointerId)) {
            pullTab.releasePointerCapture(event.pointerId);
        }

        tabDragging = false;
        tabPointerId = null;

        pullTab.classList.remove('is-dragging');
        pullTab.style.cursor = 'pointer';
    });

    pullTab.addEventListener('click', event => {
        if (suppressNextTabClick) {
            suppressNextTabClick = false;

            event.preventDefault();
            event.stopPropagation();
        }
    });

    window.addEventListener('resize', onResize);

    wrapper.addEventListener(
        'custom-crosshair-destroy',
        () => {
            window.removeEventListener('resize', onResize);
        },
        { once: true }
    );

    [slider, closeBtn, pullTab].forEach(element => {
        element.tabIndex = -1;
        element.style.outline = 'none';

        element.addEventListener('keydown', event => {
            event.preventDefault();
            event.stopImmediatePropagation();
        });
    });

    updateTabSide(tabSide);

    savedTabTop = clampTabTop(savedTabTop);
    pullTab.style.top = `${savedTabTop}px`;

    updateCrosshairSize(savedSize, false);

    if (menuHidden) {
        controls.style.display = 'none';
        pullTab.style.display = 'block';
    } else {
        controls.style.display = 'flex';
        pullTab.style.display = 'none';

        positionControls();
    }
})();

        gameInstance.progress.empty.className = "empty";
        gameInstance.progress.appendChild(gameInstance.progress.empty);
        gameInstance.progress.full = document.createElement("div");
        gameInstance.progress.full.className = "full";
        gameInstance.progress.appendChild(gameInstance.progress.full);
        gameInstance.container.appendChild(gameInstance.progress);
      }
      gameInstance.progress.full.style.width = (100 * progress) + "%";
      gameInstance.progress.empty.style.width = (100 * (1 - progress)) + "%";
      if (progress == 1)
        gameInstance.logo.style.display = gameInstance.progress.style.display = "none";
    }
    </script>

    <!-- Game launch logic: nothing loads until button is clicked -->
    <script>
    (function () {
        var gameStarted = false;
        var gameInstance = null;
        var loaderScriptLoaded = false;

        // Function to load the UnityLoader.js script dynamically
        function loadUnityLoader(callback) {
            if (loaderScriptLoaded) {
                callback();
                return;
            }
            var script = document.createElement('script');
            script.src = 'UnityLoader.js';
            script.onload = function () {
                loaderScriptLoaded = true;
                callback();
            };
            script.onerror = function () {
                document.getElementById('loading-status').textContent = 'ERR: Failed to load UnityLoader.js';
            };
            document.body.appendChild(script);
        }

        // Called when user clicks Launch Game
        window.startGame = function () {
            if (gameStarted) return;
            gameStarted = true;

            // Hide launch screen
            document.getElementById('launch_countdown_screen').style.display = 'none';
            // Show game container
            document.getElementById('gameContainer').style.display = 'block';

            // Load UnityLoader.js then instantiate the game
            loadUnityLoader(function () {
                // Now instantiate Unity
                gameInstance = UnityLoader.instantiate(
                    "unity-canvas",
                    "PG.json",
                    {
                        onProgress: UnityProgress
                    }
                );

                // Dispatch resize after a short delay to ensure canvas fits
                window.addEventListener('load', function () {
                    setTimeout(function () {
                        window.dispatchEvent(new Event('resize'));
                    }, 500);
                });
            });
        };

        // Ensure startGame is globally available (already assigned above)
    })();
    </script>
</body>
</html>
