    <!-- Inlined UnityProgress.js (same as original) -->
    <script>
    function UnityProgress(gameInstance, progress) {
      if (!gameInstance.Module)
        return;
      if (!gameInstance.logo) {
        gameInstance.logo = document.createElement("div");
        gameInstance.logo.className = "logo";
        gameInstance.container.appendChild(gameInstance.logo);
      }
      if (!gameInstance.progress) {    
        gameInstance.progress = document.createElement("div");
        gameInstance.progress.className = "progress";
        gameInstance.progress.empty = document.createElement("div");
        gameInstance.progress.empty.className = "empty";
        gameInstance.progress.appendChild(gameInstance.progress.empty);
        gameInstance.progress.full = document.createElement("div");
        gameInstance.progress.full.className = "full";
        gameInstance.progress.appendChild(gameInstance.progress.full);
        gameInstance.container.appendChild(gameInstance.progress);
      }
      gameInstance.progress.full.style.width = (100 * progress) + "%";
      gameInstance.progress.empty.style.width = (100 * (1 - progress)) + "%";
      if (progress == 1)
        gameInstance.logo.style.display = gameInstance.progress.style.display = "none";
    }
    </script>

    <!-- Game launch logic: nothing loads until button is clicked -->
    <script>
    (function () {
        var gameStarted = false;
        var gameInstance = null;
        var loaderScriptLoaded = false;

        // Function to load the UnityLoader.js script dynamically
        function loadUnityLoader(callback) {
            if (loaderScriptLoaded) {
                callback();
                return;
            }
            var script = document.createElement('script');
            script.src = 'UnityLoader.js';
            script.onload = function () {
                loaderScriptLoaded = true;
                callback();
            };
            script.onerror = function () {
                document.getElementById('loading-status').textContent = 'ERR: Failed to load UnityLoader.js';
            };
            document.body.appendChild(script);
        }

        // Called when user clicks Launch Game
        window.startGame = function () {
            if (gameStarted) return;
            gameStarted = true;

            // Hide launch screen
            document.getElementById('launch_countdown_screen').style.display = 'none';
            // Show game container
            document.getElementById('gameContainer').style.display = 'block';

            // Load UnityLoader.js then instantiate the game
            loadUnityLoader(function () {
                // Now instantiate Unity
                gameInstance = UnityLoader.instantiate(
                    "unity-canvas",
                    "PG.json",
                    {
                        onProgress: UnityProgress
                    }
                );

                // Dispatch resize after a short delay to ensure canvas fits
                window.addEventListener('load', function () {
                    setTimeout(function () {
                        window.dispatchEvent(new Event('resize'));
                    }, 500);
                });
            });
        };

        // Ensure startGame is globally available (already assigned above)
    })();
    </script>
